name: Build and test HyruleM
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: launcher/go.mod
          cache: false
      - run: go test -race -count=1 ./internal/...
  windows:
    needs: test
    permissions:
      contents: write
    runs-on: windows-latest
    defaults:
      run:
        working-directory: launcher
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: launcher/go.mod
          cache: false
      - name: Test including Windows directory junctions
        run: go test -count=1 ./internal/...
      - name: Regression test native UI, scrolling and sandbox start
        run: go test -count=1 -timeout 60s -v ./cmd/hyrule
      - name: Build native Windows applications
        run: |
          $env:CGO_ENABLED='0'
          go build -trimpath -ldflags '-s -w -H=windowsgui' -o dist/HyruleLauncher.exe ./cmd/hyrule
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -trimpath -ldflags '-s -w' -o dist/HyruleM-Server.exe ./cmd/hyrulem-server
          exit $LASTEXITCODE
      - name: Smoke test native launcher and multiplayer menu
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'hyrulem-ui-smoke.txt'
          $process = Start-Process -FilePath './dist/HyruleLauncher.exe' -ArgumentList '--smoke-test', $report -PassThru
          if (-not $process.WaitForExit(15000)) {
            Stop-Process -Id $process.Id
            throw 'Launcher smoke test timed out'
          }
          $result = Get-Content $report -Raw
          Write-Output $result
          if ($result -notmatch 'multiplayer-controls=([1-9][0-9]+)') { throw 'Multiplayer menu did not initialize' }
      - name: Package update without game or runtime
        id: package
        run: |
          $version = [regex]::Match((Get-Content internal/launcher/config.go -Raw), 'const Version = "([^"]+)"').Groups[1].Value
          if (-not $version) { throw 'Version missing' }
          $archive = "dist/HyruleM_$($version)_Windows_x64.zip"
          python tools/package.py --update-only --out $archive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "version=$version" | Add-Content $env:GITHUB_OUTPUT
          "archive=$archive" | Add-Content $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: HyruleM-${{ steps.package.outputs.version }}-Windows-x64
          path: launcher/${{ steps.package.outputs.archive }}
          if-no-files-found: error
      - name: Publish versioned releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_VERSION: ${{ steps.package.outputs.version }}
          RELEASE_ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "v$($env:RELEASE_VERSION)"
          $existing = gh release view $tag --json targetCommitish --jq .targetCommitish 2>$null
          if ($LASTEXITCODE -eq 0 -and $existing -ne $env:RELEASE_COMMIT) {
            Write-Output "Release $tag already published. Bump the version for a new release."
            exit 0
          }
          if (-not $existing) {
            gh release create $tag --target $env:RELEASE_COMMIT --title "HyruleM $($env:RELEASE_VERSION) - Correções e melhorias" --notes-file "../releases/$tag.md" --draft
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $archive = $env:RELEASE_ARCHIVE
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          "$hash  $(Split-Path $archive -Leaf)" | Set-Content -Encoding ascii 'dist/SHA256SUMS.txt'
          gh release upload $tag $archive 'dist/SHA256SUMS.txt' --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
